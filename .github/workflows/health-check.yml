name: Velog API Health Check

on:
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 00:00 (한국시간 09:00)
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write token config
        env:
          VELOG_ACCESS_TOKEN: ${{ secrets.VELOG_ACCESS_TOKEN }}
          VELOG_REFRESH_TOKEN: ${{ secrets.VELOG_REFRESH_TOKEN }}
        run: |
          echo "{\"access_token\":\"$VELOG_ACCESS_TOKEN\",\"refresh_token\":\"$VELOG_REFRESH_TOKEN\"}" > ~/.velog-mcp.json
          chmod 600 ~/.velog-mcp.json

      - name: Run health check
        id: health
        run: node scripts/health-check.mjs

      - name: Update GitHub Secrets with refreshed tokens
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set VELOG_ACCESS_TOKEN --body "${{ steps.health.outputs.access_token }}"
          gh secret set VELOG_REFRESH_TOKEN --body "${{ steps.health.outputs.refresh_token }}"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: Velog API 헬스체크 실패 — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 보기>",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "확인 사항", "value": "토큰 만료 / GH_PAT 만료 / Velog API 스펙 변경", "short": false }
                  ]
                }
              ]
            }
